name: Calidad y compilación
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Validar datos y recursos
        run: npm run validate
      - name: Ejecutar pruebas
        run: npm test
      - name: Compilar sitio
        run: npm run build
